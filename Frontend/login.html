<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BIS Sahayak</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <!-- BRAND -->
            <div class="brand">

                <div class="brand-bis">
                    BIS
                </div>

                <div class="brand-sahayak">
                    SAHAYAK
                </div>

            </div>


            <!-- HEADING -->

            <div class="auth-heading">

                <h1>Welcome Back</h1>

                <p>
                    Sign in to continue to BIS Sahayak
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="loginEmail">
                        Email <span>*</span>
                    </label>

                    <input type="email" id="loginEmail" placeholder="Enter your email" autocomplete="email" required>

                    <small id="loginEmailError" class="error">
                    </small>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <div class="password-label">

                        <label for="loginPassword">
                            Password <span>*</span>
                        </label>

                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>

                    </div>


                    <div class="password-box">

                        <input type="password" id="loginPassword" placeholder="Enter your password"
                            autocomplete="current-password" required>

                        <button type="button" class="eye-btn" id="loginEye" aria-label="Show password">
                            👁
                        </button>

                    </div>


                    <small id="loginPasswordError" class="error">
                    </small>

                </div>


                <!-- REMEMBER -->

                <div class="remember-row">

                    <label class="remember">

                        <input type="checkbox" id="rememberMe">

                        <span>Remember me</span>

                    </label>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit" class="main-btn">

                    Log In

                </button>

            </form>


            <!-- SIGN UP -->

            <p class="bottom-text">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>


            <!-- DIVIDER -->

            <div class="divider">

                <span>or</span>

            </div>


            <!-- HOME -->

            <p class="home-link">

                <a href="index.html">
                    ← Back to Home
                </a>

            </p>

        </div>

    </div>

<script src="api.js"></script>
    <script src="auth.js"></script>

</body>

</html>
